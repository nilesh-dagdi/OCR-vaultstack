<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IndicOCR — PDF to text</title>
<style>
  :root { color-scheme: light; --bg:#f5f6fa; --panel:#ffffff; --line:#e2e6ef; --fg:#1a2130; --dim:#69738a; --acc:#4f46e5; --acc-dark:#4338ca; --acc-soft:#eef2ff; --ok:#16a34a; --bad:#dc2626; --warn:#d97706; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  header { position:sticky; top:0; z-index:10; background:linear-gradient(95deg,#4f46e5 0%,#6d28d9 100%); border-bottom:1px solid #4338ca; box-shadow:0 2px 10px rgba(67,56,202,.25); padding:10px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0 8px 0 0; font-weight:700; letter-spacing:.2px; color:#fff; }
  .grow { flex:1; }
  header label { color:rgba(255,255,255,.78); font-size:12px; }
  header input[type=text] { background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.38); color:#fff; border-radius:7px; padding:6px 9px; width:250px; font:inherit; transition:border-color .15s, box-shadow .15s, background .15s; }
  header input[type=text]::placeholder { color:rgba(255,255,255,.6); }
  header input[type=text]:focus { outline:none; background:rgba(255,255,255,.24); border-color:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.22); }
  button { background:#fff; color:var(--fg); border:1px solid var(--line); border-radius:7px; padding:6px 12px; font:inherit; font-weight:500; cursor:pointer; transition:background .15s, border-color .15s, box-shadow .15s; }
  button:hover:not(:disabled) { background:#f4f6fb; border-color:#cdd4e2; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button:focus-visible { outline:none; box-shadow:0 0 0 3px var(--acc-soft); border-color:var(--acc); }
  header button { background:rgba(255,255,255,.15); border-color:rgba(255,255,255,.36); color:#fff; }
  header button:hover:not(:disabled) { background:rgba(255,255,255,.27); border-color:rgba(255,255,255,.6); }
  header button:focus-visible { box-shadow:0 0 0 3px rgba(255,255,255,.32); border-color:#fff; }
  header button.primary { background:#fff; border-color:#fff; color:var(--acc-dark); font-weight:600; box-shadow:0 1px 3px rgba(30,20,90,.28); }
  header button.primary:hover:not(:disabled) { background:#eef2ff; border-color:#eef2ff; color:var(--acc-dark); }
  header button.danger { background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.45); color:#ffe4e6; }
  header button.danger:hover:not(:disabled) { background:rgba(255,255,255,.2); }
  header .dot { box-shadow:0 0 0 3px rgba(255,255,255,.2); }
  .dot { width:9px; height:9px; border-radius:50%; background:#c5cddd; display:inline-block; box-shadow:0 0 0 3px rgba(0,0,0,.03); }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); } .dot.warn { background:var(--warn); animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  main { padding:18px; max-width:1600px; margin:0 auto; }
  #drop { border:2px dashed #d3d9e6; border-radius:12px; padding:28px 16px; text-align:center; color:var(--dim); margin-bottom:16px; background:#fff; transition:border-color .15s, background .15s, color .15s; }
  #drop:hover { border-color:#b9c3d8; }
  #drop.over { border-color:var(--acc); color:var(--fg); background:var(--acc-soft); }
  #drop b { color:var(--fg); }
  #bar { height:4px; background:#e8ecf4; border-radius:4px; overflow:hidden; margin:10px 0 5px; display:none; }
  #bar > i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--acc),#7c3aed); transition:width .3s; }
  #progress { color:var(--dim); font-size:12px; min-height:18px; }
  .page { border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:18px; background:var(--panel); box-shadow:0 1px 3px rgba(16,24,40,.05); }
  .page > header { position:static; background:#fafbff; border-bottom:1px solid var(--line); border-left:3px solid var(--acc); padding:7px 12px; font-size:12px; color:var(--dim); display:flex; gap:10px; align-items:center; }
  .page > header b { color:var(--fg); font-size:13px; }
  .split { display:grid; grid-template-columns:minmax(320px, 58%) 1fr; gap:0; }
  .imgwrap { border-right:1px solid var(--line); background:#eef0f6; display:flex; align-items:flex-start; justify-content:center; padding:10px; max-height:80vh; overflow:auto; }
  .imgwrap img { max-width:100%; height:auto; display:block; border-radius:4px; box-shadow:0 1px 4px rgba(16,24,40,.12); background:#fff; }
  pre.md { margin:0; padding:14px 16px; white-space:pre-wrap; word-break:break-word; font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace; color:#26303f; max-height:80vh; overflow:auto; }
  .err { color:var(--bad); }
  .empty { color:var(--dim); font-style:italic; }
  footer { color:var(--dim); font-size:12px; padding:0 18px 28px; max-width:1600px; margin:0 auto; }
  @media (max-width: 760px) { .split { grid-template-columns:1fr; } .imgwrap { border-right:0; border-bottom:1px solid var(--line); } }

</style>
</head>
<body>
<header>
  <h1>IndicOCR</h1>
  <span class="dot" id="dot" title="service status"></span>
  <label for="base">API</label>
  <input type="text" id="base" spellcheck="false" title="OCR service base URL">
  <input type="file" id="file" accept="application/pdf,.pdf" hidden>
  <button id="pick">Choose PDF</button>
  <button id="run" class="primary" disabled>Extract text</button>
  <button id="cancel" class="danger" disabled>Cancel</button>
  <span class="grow"></span>
  <button id="copy" disabled>Copy all</button>
  <button id="dlmd" disabled>.md</button>
  <button id="dljson" disabled>.json</button>
</header>

<main>
  <div id="drop">
    <b>Drop a PDF here</b> or use “Choose PDF”. Pages are rendered in this browser and sent to the
    OCR service one by one — nothing is uploaded in bulk, no other server involved.
  </div>
  <div id="bar"><i></i></div>
  <div id="progress"></div>
  <div id="pages"></div>
</main>
<footer>
  Scanned PDFs work best. ~17 s per page; pages are processed in order. Text stays in this tab until you download it.
</footer>

<script type="module">
import * as pdfjsLib from './vendor/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = './vendor/pdf.worker.min.mjs';

const $ = (id) => document.getElementById(id);
const baseEl = $('base'), dot = $('dot'), fileEl = $('file'), pagesEl = $('pages');
const progressEl = $('progress'), barEl = $('bar'), barFill = barEl.firstElementChild;
const btn = { pick: $('pick'), run: $('run'), cancel: $('cancel'), copy: $('copy'), md: $('dlmd'), json: $('dljson') };

const DPI = 200, MAX_EDGE = 4200;
let pdfFile = null, results = [], running = false, cancelled = false, controller = null;

const state = { base: localStorage.getItem('indicocr.base') || 'http://127.0.0.1:8094' };
baseEl.value = state.base;
baseEl.addEventListener('change', () => {
  state.base = baseEl.value.trim().replace(/\/+$/, '');
  baseEl.value = state.base;
  localStorage.setItem('indicocr.base', state.base);
  checkHealth();
});

function setDot(kind, title) { dot.className = 'dot' + (kind ? ' ' + kind : ''); dot.title = title || ''; }

async function checkHealth() {
  setDot('warn', 'checking…');
  try {
    const r = await fetch(state.base + '/health', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (j.status === 'ready') { setDot('ok', 'ready'); return true; }
    if (j.status === 'error') { setDot('bad', j.error || 'error'); return false; }
    setDot('warn', 'engine warming up'); return false;
  } catch (e) {
    setDot('bad', 'unreachable: ' + e.message);
    return false;
  }
}

function setFile(f) {
  if (!f) return;
  if (!/\.pdf$/i.test(f.name) && f.type !== 'application/pdf') { alert('Please choose a PDF file.'); return; }
  pdfFile = f;
  btn.run.disabled = false;
  $('drop').innerHTML = '<b>' + escapeHtml(f.name) + '</b> · ' + (f.size / 1048576).toFixed(2) + ' MB';
  resetResults();
}

function resetResults() {
  results = [];
  pagesEl.innerHTML = '';
  progressEl.textContent = '';
  barEl.style.display = 'none';
  toggleOutput(false);
}

function toggleOutput(on) {
  for (const k of ['copy', 'md', 'json']) btn[k].disabled = !on;
}

btn.pick.onclick = () => fileEl.click();
fileEl.onchange = () => setFile(fileEl.files[0]);
$('drop').onclick = () => fileEl.click();

['dragenter', 'dragover'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer?.files?.[0]) setFile(e.dataTransfer.files[0]); });

function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function pageCard(n) {
  const el = document.createElement('section');
  el.className = 'page';
  el.dataset.page = n;
  el.innerHTML =
    '<header><b>Page ' + n + '</b><span class="status">rendering…</span></header>' +
    '<div class="split"><div class="imgwrap"></div><pre class="md empty">waiting for the model…</pre></div>';
  pagesEl.appendChild(el);
  return {
    root: el,
    img: el.querySelector('.imgwrap'),
    md: el.querySelector('pre.md'),
    status: el.querySelector('.status'),
  };
}

async function renderPage(pdf, n) {
  const page = await pdf.getPage(n);
  const base = page.getViewport({ scale: 1 });
  const scale = Math.min(DPI / 72, MAX_EDGE / Math.max(base.width, base.height));
  const vp = page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  canvas.width = Math.floor(vp.width);
  canvas.height = Math.floor(vp.height);
  await page.render({ canvasContext: canvas.getContext('2d', { alpha: false }), viewport: vp }).promise;
  const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
  const url = URL.createObjectURL(blob);
  page.cleanup();
  return { blob, url };
}

async function run() {
  if (!pdfFile || running) return;
  running = true; cancelled = false;
  btn.run.disabled = true; btn.pick.disabled = true; btn.cancel.disabled = false;
  resetResults();
  barEl.style.display = 'block';

  const t0 = performance.now();
  let pdf;
  try {
    const buf = await pdfFile.arrayBuffer();
    pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise;
  } catch (e) {
    progressEl.textContent = 'Cannot open PDF: ' + e.message;
    finish(); return;
  }

  const total = pdf.numPages;
  progressEl.textContent = total + ' page(s)';
  results = [];

  for (let n = 1; n <= total; n++) {
    if (cancelled) break;
    const card = pageCard(n);
    const ps = performance.now();
    try {
      card.status.textContent = 'rendering…';
      const { blob, url } = await renderPage(pdf, n);
      const img = new Image();
      img.src = url;
      img.alt = 'page ' + n;
      img.onload = () => URL.revokeObjectURL(url);
      card.img.appendChild(img);

      if (cancelled) break;
      card.status.textContent = 'OCR…';
      setBar((n - 1) / total, 'Page ' + n + '/' + total + ' · ' + Math.round((performance.now() - t0) / 1000) + ' s elapsed');

      controller = new AbortController();
      const fd = new FormData();
      fd.append('file', blob, 'page-' + n + '.png');
      const t1 = performance.now();
      const res = await fetch(state.base + '/ocr', { method: 'POST', body: fd, signal: controller.signal });
      if (!res.ok) {
        const body = await res.text();
        throw new Error('HTTP ' + res.status + ' — ' + body.slice(0, 300));
      }
      const data = await res.json();
      const secs = ((performance.now() - t1) / 1000).toFixed(1);
      card.md.classList.remove('empty');
      card.md.textContent = data.markdown || '';
      card.status.textContent = secs + ' s · ' + (data.blocks?.length ?? 0) + ' blocks';
      results.push({ page: n, width: data.width, height: data.height, markdown: data.markdown || '', blocks: data.blocks || [] });
      toggleOutput(results.length > 0);
    } catch (e) {
      if (e.name === 'AbortError' || cancelled) { card.status.textContent = 'cancelled'; break; }
      card.md.classList.add('err');
      card.md.textContent = 'Error: ' + e.message;
      card.status.textContent = 'failed';
      if (/Failed to fetch|NetworkError/i.test(e.message) && !state.base.includes('127.0.0.1')) {
        card.md.textContent += '\n\nThe API is unreachable from this browser. Start the SSH tunnel (start.ps1) and keep the API field at http://127.0.0.1:8094.';
      }
    }
  }

  setBar(1, cancelled ? 'Cancelled after ' + results.length + ' page(s)' : 'Done · ' + results.length + '/' + total + ' pages in ' +
    ((performance.now() - t0) / 1000).toFixed(0) + ' s');
  finish();
}

function setBar(frac, text) {
  barFill.style.width = Math.max(2, Math.min(100, frac * 100)) + '%';
  if (text) progressEl.textContent = text;
}

function finish() {
  running = false;
  btn.run.disabled = !pdfFile;
  btn.pick.disabled = false;
  btn.cancel.disabled = true;
  controller = null;
}

btn.run.onclick = run;
btn.cancel.onclick = () => {
  cancelled = true;
  btn.cancel.disabled = true;
  controller?.abort();
};

function combined() {
  return results.map(r => '## Page ' + r.page + '\n\n' + r.markdown.trim()).join('\n\n---\n\n');
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/plain;charset=utf-8' }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const stem = () => (pdfFile?.name || 'document').replace(/\.pdf$/i, '');

btn.copy.onclick = async () => {
  try { await navigator.clipboard.writeText(combined()); btn.copy.textContent = 'Copied'; }
  catch { btn.copy.textContent = 'Copy failed'; }
  setTimeout(() => (btn.copy.textContent = 'Copy all'), 1500);
};
btn.md.onclick = () => download(stem() + '.md', combined(), 'text/markdown;charset=utf-8');
btn.json.onclick = () => download(stem() + '.json', JSON.stringify({ file: pdfFile?.name, pages: results }, null, 2), 'application/json');

checkHealth();
setInterval(() => { if (!running) checkHealth(); }, 15000);
</script>
</body>
</html>
